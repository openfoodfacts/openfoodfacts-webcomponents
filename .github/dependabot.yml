version: 2
updates:
  # Keep npm dependencies up to date in web-components
  - package-ecosystem: "npm"
    directory: "/web-components"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      lit-and-localization:
        patterns:
          - "lit"
          - "@lit/*"
          - "@lit-labs/*"
        update-types:
          - "minor"
          - "patch"
      storybook-and-testing:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "@chromatic-com/storybook"
          - "eslint-plugin-storybook"
          - "vitest"
          - "@vitest/*"
          - "@open-wc/testing"
          - "jsdom"
          - "playwright"
        update-types:
          - "minor"
          - "patch"
      runtime-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      build-and-publishing:
        patterns:
          - "actions/checkout"
          - "actions/setup-node"
          - "actions/*pages*"
          - "googleapis/release-please-action"
          - "crowdin/github-action"
        update-types:
          - "minor"
          - "patch"
      repository-automation:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
